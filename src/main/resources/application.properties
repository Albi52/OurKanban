# =========================
# APPLICATION NAME
# =========================
spring.application.name=ourkanban

spring.config.import=optional:application-secrets.properties

# =========================
# DATABASE (MySQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ourkanban}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# JWT CONFIG (custom)
# =========================

jwt.expiration=864000000


# =========================
# GOOGLE OAUTH2 LOGIN
# =========================
### Secret ### google.client-id=
google.scope=openid,profile,email


# =========================
# EMAIL CONFIG
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

### Secret ### spring.mail.username=
### Secret ### spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=http://twinchainstudiostesting.es
app.frontend-url-www=https://www.twinchainstudiostesting.es

# =========================
# SERVER CONFIG (optional)
# =========================
server.port=8080

#=========================
# Image upload configuration
#=========================
app.upload-dir=${app.upload-dir-local:/app/uploads/avatars}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB



# =========================
# DEBUG (optional but useful)
# =========================
spring.datasource.hikari.connection-timeout=5000

#logging.level.org.springframework.security=DEBUG